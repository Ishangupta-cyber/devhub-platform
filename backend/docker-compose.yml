version: '3.9'

services:
#we are telling that which service we want to run and which image we want to use for that service
  db:
    image: postgres:15
    container_name: devhub_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: devhub_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: