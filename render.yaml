services:
  - type: web
    name: devhub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devhub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: devhub-redis
          property: connectionString

  - type: keyvalue
    name: devhub-redis
    ipAllowList: []

databases:
  - name: devhub-db
