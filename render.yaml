services:
  - type: web
    name: devhub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_demo_data
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: SECRET_KEY
        generateValue: true
      # The Vercel frontend origin(s), comma-separated, e.g. https://devhub-platform-tan.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://devhub-platform-tan.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # No separate Celery worker on this blueprint, so notifications and the
      # activity feed run inline. If you add a worker service
      # (`celery -A config worker`), set this to "False".
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # OAuth Web client id from Google Cloud Console; also set
      # VITE_GOOGLE_CLIENT_ID to the same value for the frontend build.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: devhub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: devhub-redis
          property: connectionString

  - type: keyvalue
    name: devhub-redis
    ipAllowList: []

databases:
  - name: devhub-db
